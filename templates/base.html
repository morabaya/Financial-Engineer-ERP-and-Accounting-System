<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Engineer ERP</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">Financial Engineer</div>
            <ul class="nav-links">
                <li><a href="/dashboard" class="active"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li><a href="/pos"><i class="fas fa-cash-register"></i> نقطة البيع</a></li>
                <li><a href="/vouchers"><i class="fas fa-file-invoice"></i> السندات</a></li>
                <li><a href="/invoices"><i class="fas fa-file-invoice-dollar"></i> الفواتير</a></li>
                <li><a href="/inventory"><i class="fas fa-boxes"></i> المخازن</a></li>
                <li><a href="/reports"><i class="fas fa-chart-line"></i> التقارير الماليـة</a></li>
                <li><a href="/loans"><i class="fas fa-hand-holding-usd"></i> القروض</a></li>
                <li><a href="/settings"><i class="fas fa-cog"></i> الإعدادات</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-bar">
                <div class="user-info">مرحباً، <span id="username">المستخدم</span></div>
                <div class="ai-assistant-trigger" onclick="toggleAI()">
                    <i class="fas fa-robot"></i> المساعد الذكي
                </div>
            </header>

            <!-- Multi-Tab System -->
            <div class="tab-container">
                <div class="tab-headers" id="tab-headers">
                    <!-- Tabs will be added here dynamically -->
                </div>
                <div class="tab-body" id="tab-body">
                    <!-- Content of the active tab -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Floating Assistant -->
    <div id="ai-chat-window" class="ai-hidden">
        <div class="ai-header">المساعد المالي الذكي <span onclick="toggleAI()">×</span></div>
        <div id="ai-messages" class="ai-messages"></div>
        <div class="ai-input-area">
            <input type="text" id="ai-input" placeholder="اسأل عن تقرير أو اطلب إنشاء سند...">
            <button onclick="sendToAI()">إرسال</button>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
